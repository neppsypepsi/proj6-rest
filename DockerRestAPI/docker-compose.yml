# Brevet calculator, REST service, consumer website, and MongoDB.
# Host ports start at 5001 because macOS often reserves 5000 for AirPlay.

services:
  brevets:            # Project 5 calculator: Submit saves to MongoDB
    build: ./brevets
    ports:
      - "5001:5000"   # host:container
    environment:
      MONGO_HOST: db
      MONGO_PORT: "27017"
    depends_on:
      - db

  api:                # REST service: /listAll, /listOpenOnly, /listCloseOnly
    build: ./api
    ports:
      - "5002:80"
    environment:
      MONGO_HOST: db
      MONGO_PORT: "27017"
    depends_on:
      - db

  website:            # Consumer program (PHP), calls http://api/...
    image: php:8.3-apache
    volumes:
      - ./website:/var/www/html
    ports:
      - "5003:80"
    depends_on:
      - api

  db:
    image: mongo:7.0
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
